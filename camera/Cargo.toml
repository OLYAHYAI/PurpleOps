[workspace]
resolver = "2"
members = ["crates/ptpip", "crates/p900ctl", "crates/fakecam", "crates/screenctl"]
# Le client PC (Windows) n'est pas compilé pour arm64 : on l'exclut du workspace.
exclude = ["pc-client/screenview"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["p900ctl contributors"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
