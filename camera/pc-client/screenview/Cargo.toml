[package]
name = "screenview"
description = "Client PC (Windows) : affiche l'écran du téléphone et renvoie les touchers — scrcpy maison PurpleOps"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Fenêtre + tampon de pixels + souris/clavier, une seule dépendance, multiplateforme.
minifb = "0.25"
# Décodeur H.264 (Cisco OpenH264, compilé depuis les sources et embarqué : rien à installer).
openh264 = "0.9"

# Icône et métadonnées de l'exécutable (build.rs). Hôte Windows uniquement (CI windows-2025).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2

# `--cfg winapi_check` : vérifie le code Win32 depuis Linux (cargo check, sans édition de liens).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(winapi_check)'] }
