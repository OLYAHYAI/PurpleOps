name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # necessaire pour publier une Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pas de setup-android : SDK preinstalle sur ubuntu-latest.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # versionCode = numero de build (monotone) ; versionName = 0.1.<build>.
      - name: Build debug APK
        run: >
          gradle assembleDebug --no-daemon --stacktrace
          -PverCode=${{ github.run_number }}
          -PverName=0.1.${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PurpleOps-v${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpleOps-debug-apk
          path: PurpleOps-v${{ github.run_number }}.apk
          if-no-files-found: error

      # Publie une Release : c'est ce que l'app interroge pour l'auto-update.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ github.run_number }}"
          "PurpleOps-v${{ github.run_number }}.apk"
          -R "${{ github.repository }}"
          -t "v${{ github.run_number }}"
          -n "Build automatique — ${{ github.sha }}"
