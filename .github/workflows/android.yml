name: build-apk

on:
  push:
    branches: [ main, master ]
    # Un commit qui ne touche QUE le serveur MCP ne doit pas rebuild/réinstaller l'APK.
    paths-ignore:
      - 'mcp-server/**'
      - 'proto/**'
      - '.github/workflows/proto-slint.yml'
  # Verification des PR : compile tout (Rust + APK release NON signe), ne publie
  # rien et n'a acces a aucun secret.
  pull_request:
    paths-ignore:
      - 'mcp-server/**'
      - 'proto/**'
      - '.github/workflows/proto-slint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # Cache « basic » = enveloppe MIT d'actions/cache (le fournisseur par défaut
      # de la v6 est propriétaire).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'
          cache-provider: basic
      - name: Rust (tests hote + build arm64)
        run: |
          rustup target add aarch64-linux-android
          cargo test --manifest-path camera/Cargo.toml --quiet
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          cargo build --manifest-path camera/Cargo.toml --release -p p900ctl -p screenctl --target aarch64-linux-android
      - name: APK release non signe (compilation + lint vital)
        run: gradle assembleRelease --no-daemon --stacktrace

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Les secrets de signature ne sont exposes qu'a ce job (environnement protege).
    environment: release
    permissions:
      contents: write   # necessaire pour publier une Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Pas de setup-android : SDK preinstalle sur ubuntu-latest.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'
          # Job qui manipule la clé de signature : pas de cache réutilisé (un
          # cache est une entrée non vérifiée du build signé).
          cache-disabled: true

      # Module camera (Rust) : tests sur l'hote, puis binaire Android arm64
      # embarque dans l'APK comme libp900ctl.so (extrait dans nativeLibraryDir).
      - name: Build p900ctl (camera Nikon)
        run: |
          rustup target add aarch64-linux-android
          cargo test --manifest-path camera/Cargo.toml --quiet
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          cargo build --manifest-path camera/Cargo.toml --release -p p900ctl --target aarch64-linux-android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp camera/target/aarch64-linux-android/release/p900ctl app/src/main/jniLibs/arm64-v8a/libp900ctl.so

      # Service de partage d'écran USB (scrcpy maison) : même embarquement arm64.
      - name: Build screenctl (partage ecran USB)
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          cargo build --manifest-path camera/Cargo.toml --release -p screenctl --target aarch64-linux-android
          cp camera/target/aarch64-linux-android/release/screenctl app/src/main/jniLibs/arm64-v8a/libscreenctl.so

      # Cle de release : secret base64 decode hors du depot, efface en fin de job.
      # Echec volontaire si le secret manque : on ne publie JAMAIS un APK signe
      # par une autre cle (il casserait la mise a jour des telephones).
      - name: Decode release keystore
        env:
          PO_KEYSTORE_B64: ${{ secrets.PO_KEYSTORE_B64 }}
        run: |
          test -n "$PO_KEYSTORE_B64" || { echo "::error::secret PO_KEYSTORE_B64 absent"; exit 1; }
          echo "$PO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # versionCode = numero de build (monotone) ; versionName = 0.1.<build>.
      - name: Build release APK (signe)
        env:
          PO_KEYSTORE_PASS: ${{ secrets.PO_KEYSTORE_PASS }}
          PO_KEY_ALIAS: ${{ secrets.PO_KEY_ALIAS }}
          PO_KEY_PASS: ${{ secrets.PO_KEY_PASS }}
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PverCode=${{ github.run_number }}
          -PverName=0.1.${{ github.run_number }}

      - name: Verify signer + SHA-256
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          APK=PurpleOps-v${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          if grep -qi "CN=Android Debug" signer.txt; then echo "::error::APK signe par une cle debug"; exit 1; fi
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PurpleOps-apk
          path: |
            PurpleOps-v${{ github.run_number }}.apk
            PurpleOps-v${{ github.run_number }}.apk.sha256
          if-no-files-found: error

      # Publie une Release : c'est ce que l'app interroge pour l'auto-update.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ github.run_number }}"
          "PurpleOps-v${{ github.run_number }}.apk"
          "PurpleOps-v${{ github.run_number }}.apk.sha256"
          -R "${{ github.repository }}"
          -t "v${{ github.run_number }}"
          -n "Build automatique — ${{ github.sha }}"

  # Client PC du partage d'écran USB : compilé sous Windows (Rust + MSVC
  # préinstallés sur windows-latest) et attaché à la même Release.
  # Job séparé : s'il échoue, l'APK est déjà publié.
  screenview-windows:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build screenview.exe
        run: cargo build --release --manifest-path camera/pc-client/screenview/Cargo.toml

      - name: Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "v${{ github.run_number }}"
          camera/pc-client/screenview/target/release/screenview.exe
          -R "${{ github.repository }}"
