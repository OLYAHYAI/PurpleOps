name: proto-slint

# Prototype go/no-go Slint (lot L2). APK de TEST uniquement : artefact du run,
# jamais de Release (l'Updater de l'appli ne le verra pas), identifiant
# d'appli distinct (com.jbr.purpleops.proto), aucun secret.
on:
  pull_request:
    paths: ['proto/slint-shell/**', '.github/workflows/proto-slint.yml']
  push:
    branches: ['proto/**']
    paths: ['proto/slint-shell/**', '.github/workflows/proto-slint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Rust → libproto.so (arm64, API 33)
        working-directory: proto/slint-shell/rust
        run: |
          rustup target add aarch64-linux-android
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android33-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android33-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android33-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          cargo build --release --target aarch64-linux-android
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libproto.so ../android/app/src/main/jniLibs/arm64-v8a/
          ls -l ../android/app/src/main/jniLibs/arm64-v8a/
          # Dépendances dynamiques : tout doit être fourni par Android (pas de libc++_shared oubliée).
          "$TC/llvm-readelf" -d target/aarch64-linux-android/release/libproto.so | grep NEEDED

      - name: APK (release non minifié, clé debug de la CI)
        run: gradle -p proto/slint-shell/android assembleRelease --no-daemon --stacktrace

      - name: Taille
        run: |
          APK=proto/slint-shell/android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" PurpleOps-proto-slint.apk
          ls -l PurpleOps-proto-slint.apk
          sha256sum PurpleOps-proto-slint.apk | tee PurpleOps-proto-slint.apk.sha256
          echo "### APK prototype : $(du -h PurpleOps-proto-slint.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PurpleOps-proto-slint
          path: |
            PurpleOps-proto-slint.apk
            PurpleOps-proto-slint.apk.sha256
          if-no-files-found: error
          retention-days: 14
