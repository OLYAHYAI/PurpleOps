# PurpleOps MCP — configuration (chroot Debian du Pixel 7a)
# ATTENTION : valeurs à confirmer sur le téléphone avant tout lancement réel.

# --- Réseau : Tailscale-only --------------------------------------------------
# IP Tailscale du téléphone. JAMAIS 0.0.0.0. (127.0.0.1 réservé aux tests locaux.)
# "auto" = détecte seul l'IP Tailscale (100.64.0.0/10) de l'interface — recommandé
# pour l'usage sans câble (ne casse pas si l'IP du tailnet change). Une IP littérale
# reste acceptée.
bind_host: "auto"
bind_port: 8765

# --- Secrets & journal --------------------------------------------------------
# Fichier token (chmod 0600), jamais commité dans PurpleOps.
token_file: "/etc/purpleops-mcp/token"
# Journal d'audit JSONL, surveillé par l'agent Wazuh 027 (localfile).
log_file: "/var/log/purpleops-mcp.log"

exec_timeout_s: 300

# --- Pilotage de l'écran du téléphone (outils phone_*) ------------------------
# Prise Unix ouverte par screenctl (onglet Écran de PurpleOps) dans ce chroot,
# uniquement si « Autoriser le pilotage par l'IA » est cochée sur le téléphone.
phone_socket: "/opt/purpleops-mcp/screenctl.sock"

# --- Entrée dans le chroot Kali ----------------------------------------------
# ARCHI : le serveur tourne DANS le chroot Kali (outils locaux). Il n'y a donc
# aucun saut de chroot à faire -> préfixe vide. Les commandes s'exécutent
# directement (nmap, sslscan, ...) dans l'environnement du serveur.
# (Le journal écrit dans /var/log ici = /android/kali/var/log vu par l'agent
#  Wazuh côté Debian via le bind ro -> traçabilité déjà en place.)
kali_invoke: []

# --- Garde-fou cible : allowlist CIDR ----------------------------------------
allowed_targets:
  - "100.64.0.0/10"     # plage Tailscale (tailnet)
  - "10.10.10.0/24"     # LAN homelab
  # ajouter ici le VLAN cible purple-team dédié si besoin

